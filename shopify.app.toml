# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "3064ddc918220795fa21739de76542f5"
name = "product-questions-and-answers"
application_url = "https://shopify-qa.orivisdev.shop/"
embedded = true
handle = "product-questions-and-answers-2"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Note: write_payments scope will be required for production billing
# Currently not added because app needs to be approved for billing first
scopes = "write_products,read_products"

[auth]
redirect_urls = [
  "https://shopify-qa.orivisdev.shop/api/auth",
  "https://shopify-qa.orivisdev.shop/api/auth/callback"
]

[pos]
embedded = false

[app_proxy]
url = "https://shopify-qa.orivisdev.shop/"
prefix = "apps"
subpath = "a"
